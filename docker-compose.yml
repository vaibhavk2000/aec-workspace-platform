version: '3.8'
services:
  backend-service:
    build: ./backend
    container_name: aec-backend-api
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    expose:
      - "8000"
    networks:
      - aec-network

  frontend-service:
    build: ./frontend
    container_name: aec-frontend-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-service
    networks:
      - aec-network

networks:
  aec-network:
    driver: bridge
