version: '3.8'

services:
  # Relational Database Staging
  db-service:
    image: postgres:15-alpine
    container_name: aec-postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-aec_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - aec-db-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - aec-network

  # FastAPI Computational Core API Engine
  backend-service:
    build: ./backend
    container_name: aec-backend-api
    restart: always
    environment:
      - DB_HOST=db-service
      - DB_NAME=${DB_NAME:-aec_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super_secret_aec_platform_key_9931}
    volumes:
      - ./backend/temp_uploads:/app/temp_uploads
    expose:
      - "8000"
    depends_on:
      - db-service
    networks:
      - aec-network

  # React Frontend Presentation Interface Stack
  frontend-service:
    build: ./frontend
    container_name: aec-frontend-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-service
    networks:
      - aec-network

volumes:
  aec-db-data:
    driver: local

networks:
  aec-network:
    driver: bridge
